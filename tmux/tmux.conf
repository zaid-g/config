# source-file <path>
# Each section (`#  %% -------- [*] ----------:`) should
# be organized in following order:
# - options
# - bindings

#  %% -------- [settings] ----------:

# set-option prefix
set-option -g prefix C-g
set-option -g status-interval 1
set-option -g mouse on
set-option -sg escape-time 0
set-option -g display-panes-time 999999

# unbind default prefix button
unbind C-b
# remove default 'i' (pane info) so prefix+i just cancels prefix-wait
unbind i
# resource
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded!"

#  %% -------- [mappings via key tables] ----------:

# prefix + m → enters "m" table
bind m switch-client -T m
bind -T m m select-pane -m # remap existing prefix+m functionality
# m → g: enters "mg" table (go to views/panes)
bind -T m g switch-client -T mg
# m → k: enters "mk" table (kiro shortcuts)
bind -T m k switch-client -T mk
# m → s: enters "ms" table (sentence/paragraph text shortcuts)
bind -T m s switch-client -T ms
# m → t: enters "mt" table (terminal commands)
bind -T m t switch-client -T mt

#  %% -------- [appearence shape UI looks organization color (copy these to configure on diff machine)] ----------:

# terminal color
set-option -g default-terminal "tmux-256color"
set-option -as terminal-features ',xterm-256color:RGB'

# Pane borders
set-option -g pane-border-lines double
set-option -g pane-border-style fg=colour$COLOR_THEME
set-option -g pane-active-border-style fg=colour$COLOR_ACTIVE

# Status bar
set-option -g status-style "#{?client_prefix,bg=colour$COLOR_ACTIVE,bg=colour$COLOR_THEME},fg=colour$COLOR_TEXT_IF_COLORED_BACKGROUND"
set-option -g status-right '%S'
set-option -g window-status-current-style fg=colour$COLOR_TEXT_IF_COLORED_BACKGROUND,bg=colour$COLOR_HIGHLIGHT_TEXT_TMUX,bold
set-option -g window-status-style fg=colour$COLOR_TEXT_IF_COLORED_BACKGROUND,bg=colour$COLOR_THEME

# Copy mode appearence
set-option -g mode-style "fg=colour$COLOR_TEXT_IF_COLORED_BACKGROUND,bg=colour$COLOR_HIGHLIGHT_TEXT_TMUX"
set-hook -g pane-mode-changed 'if -F "#{pane_in_mode}" "select-pane -P bg=#$COLOR_HEX_ACTIVE_BACKGROUND" "select-pane -P bg=default"'

#  %% -------- [copy mode stuff] ----------:

# history
set-option -g history-limit 250000
# vi mode
set-option -g mode-keys vi

unbind [
# Unbind 'q' only in copy-mode-vi (so prefix+q in normal mode still works)
unbind -T copy-mode-vi q
bind Escape copy-mode
# similar to how `i` exits view mode and enters insert mode in vim
bind -T copy-mode-vi i send -X cancel
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection
bind -T copy-mode-vi 'Y' send -X copy-selection-and-cancel

# mouse copy
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection
bind -T copy-mode-vi WheelDownPane send-keys -X scroll-down-and-cancel

# clear history scroll
bind space clear-history \; display-message "History cleared!"
bind C-space clear-history \; display-message "History cleared!"

#  %% -------- [windows panes tabs] ----------:

# renumber window index when closing
set-option -g renumber-windows on

# i have my own auto rename system
set-window-option -g automatic-rename off

# mg → N: go to window 1 pane 2, inner tmux window 0, and send <esc>1gt (doc notes.txt)
bind -T mg N select-window -t :1 \; select-pane -t :1.1 \; if -F '#{window_zoomed_flag}' '' 'resize-pane -Z' \; send-keys C-g 0 \; send-keys Escape \; send-keys 1gt
# mg → J: go to window 1 pane 2, inner tmux window 0, and send <esc>2gt (doc junk.txt)
bind -T mg J select-window -t :1 \; select-pane -t :1.1 \; if -F '#{window_zoomed_flag}' '' 'resize-pane -Z' \; send-keys C-g 0 \; send-keys Escape \; send-keys 2gt
# mg → n: go to current window pane 2 (unzoomed), inner tmux window 0, and send <esc>1gt (doc notes.txt)
bind -T mg n select-pane -t :.1 \; if -F '#{window_zoomed_flag}' 'resize-pane -Z' '' \; send-keys C-g 0 \; send-keys Escape \; send-keys 1gt
# mg → j: go to current window pane 2 (unzoomed), inner tmux window 0, and send <esc>2gt (doc junk.txt)
bind -T mg j select-pane -t :.1 \; if -F '#{window_zoomed_flag}' 'resize-pane -Z' '' \; send-keys C-g 0 \; send-keys Escape \; send-keys 2gt
# mg → c: go to large code editor — current window pane 2, inner tmux window 1, maximized
bind -T mg c select-pane -t :.1 \; if -F '#{window_zoomed_flag}' '' 'resize-pane -Z' \; send-keys C-g 1
# mg → a: go to current window pane 0 (AI)
bind -T mg a select-pane -t :.0
# mg → t: go to current window pane 3 (terminal)
bind -T mg t select-pane -t :.2

# splits
bind s split-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# h family
bind h select-pane -L
bind H splitw -fhb \; swapp -t ! \; killp -t !
bind C-h previous-window
bind -r M-h resize-pane -L 5

# j family
bind j select-pane -D
bind J splitw -fv  \; swapp -t ! \; killp -t !
bind C-j run-shell 'zsh -c "source ~/.zshrc && TMUX_SWAP_WINDOW_NEXT" >/dev/null 2>&1'
bind -r M-j resize-pane -D 5

# k family
bind k select-pane -U
bind K splitw -fvb \; swapp -t ! \; killp -t !
bind C-k run-shell 'zsh -c "source ~/.zshrc && TMUX_SWAP_WINDOW_PREV" >/dev/null 2>&1'
bind -r M-k resize-pane -U 5

# l family
bind l select-pane -R
bind L splitw -fh  \; swapp -t ! \; killp -t !
bind C-l next-window
bind -r M-l resize-pane -R 5

# e family
bind e select-window -t '{end}'
bind C-e run-shell 'tmux move-window -t 999 && tmux move-window -r'

# n family
bind n new-window -a -c "#{pane_current_path}" -n "#{window_name}"
bind N run-shell 'zsh -c "source ~/.zshrc && TCOBPJ" >/dev/null 2>&1'
bind C-n command-prompt -p 'Name (no special chars):' 'run-shell "zsh -c \"source ~/.zshrc && TCOBPJ %1\" >/dev/null 2>&1"'
bind M-n new-window \; send-keys 'CDJ' Enter

# switch to last active tab (like alt-tab)
bind C-w last-window
# send prefix to inner tmux (for nested sessions)
bind C-g send-prefix

# send pane to specific window position e.g. 1.0
bind M command-prompt -p "send pane to:"  "join-pane -t '%%'"

# rename pane
bind , command-prompt -I "#W" "rename-window '%%'; set-window-option @AUTORENAME 0"
# lock tab name (disable auto-rename)
bind R set-window-option @AUTORENAME 0

bind X confirm-before -p "Kill window #W? (y/n)" kill-window

#  %% -------- [kiro] ----------:

# mk → s: save kiro chat, fork into new window, and load
bind -T mk s run-shell -b 'zsh -c "source ~/.zshrc && TMUX_KIRO_FORK_NEW_WINDOW"'

#  %% -------- [inline text shortcuts] ----------:

bind -T ms b run-shell 'tmux send-keys -t "#{pane_id}" "btw, you are working from #{pane_current_path}. This project (task) has a \`brain/\` folder — my personal (and collaborative with AI) knowledge base for it. No need to read these now, just know they exist: \`brain/notes.txt\`: key task notes (gotchas, build/deploy/useful commands). \`brain/junk/junk.txt\`: unorganized notes/pastes/logs to keep. \`brain/command_history.txt\` and \`brain/command_history_full.txt\`: every command run inside this dir, auto-logged by zsh hooks (timestamped, with invocation path) — useful if you need to see what has already been run. \`brain/brag.txt\`: my log of career-relevant wins from this project. \`brain/command_output/\`: write your temp logs here (build output etc.). \`brain/venv/\`: create and source virtualenvs here. \`brain/tmp/\`: scratch space, like /tmp. Acknowledge, then we can focus on the task."'

#  %% -------- [terminal commands] ----------:

bind -T mt c send-keys -t 0.0 'CAFF' Enter
