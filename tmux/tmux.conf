# source-file <path>
# Each section (`#  %% -------- [*] ----------:`) should
# be organized in following order:
# - options
# - bindings

#  %% -------- [settings] ----------:

# set-option prefix
set-option -g prefix C-g
set-option -g status-interval 1
set-option -g mouse on
set-option -sg escape-time 0
# to allow rapid entries in pane without tmux thinking it's pasted text:
set-option -g assume-paste-time 0
set-option -g display-panes-time 999999

# unbind default prefix button
unbind C-b
# remove default 'i' (window info) so prefix+i just cancels prefix-wait
unbind i
# resource
bind R run-shell '~/doc/config/config/tmux/resource_tmux_config_in_all_sessions.sh'

#  %% -------- [mappings via key tables] ----------:

# prefix + m → enters "m" table
bind m switch-client -T m
bind -T m m select-pane -m # remap existing prefix+m functionality
# m → k: enters "mk" table (kiro shortcuts)
bind -T m k switch-client -T mk
# m → s: enters "ms" table (sentence/paragraph text shortcuts)
bind -T m s switch-client -T ms

#  %% -------- [clipboard copy paste] ----------:

# nested tmux clipboard: the tmux-256color terminfo lacks Ms, so an inner tmux thinks it
# cannot set the clipboard — declare the capability, and use "on" (not "external") so each
# tmux accepts OSC 52 from its panes and forwards it outward to the real terminal
set-option -as terminal-features ',tmux*:clipboard'
set-option -s set-clipboard on

#  %% -------- [appearence shape UI looks organization color (copy these to configure on diff machine)] ----------:

# terminal color
set-option -g default-terminal "tmux-256color"
set-option -as terminal-features ',xterm-256color:RGB'

# Pane borders
set-option -g pane-border-lines double
set-option -g pane-border-style fg=colour$COLOR_THEME
set-option -g pane-active-border-style fg=colour$COLOR_ACTIVE

# Status bar
set-option -g status-style "#{?client_prefix,bg=colour$COLOR_ACTIVE,bg=colour$COLOR_THEME},fg=colour$COLOR_TEXT_IF_COLORED_BACKGROUND"
set-option -g status-left ''
set-option -g status-right '%S'
set-option -g window-status-current-style fg=colour$COLOR_TEXT_IF_COLORED_BACKGROUND,bg=colour$COLOR_HIGHLIGHT_TEXT_TMUX,bold
set-option -g window-status-style fg=colour$COLOR_TEXT_IF_COLORED_BACKGROUND,bg=colour$COLOR_THEME

# Copy mode appearence
set-option -g mode-style "fg=colour$COLOR_TEXT_IF_COLORED_BACKGROUND,bg=colour$COLOR_HIGHLIGHT_TEXT_TMUX"
set-hook -g pane-mode-changed 'if -F "#{pane_in_mode}" "select-pane -P bg=#$COLOR_HEX_ACTIVE_BACKGROUND" "select-pane -P bg=default"'

#  %% -------- [copy mode stuff] ----------:

# history
set-option -g history-limit 250000
# vi mode
set-option -g mode-keys vi

unbind [
# Unbind 'q' only in copy-mode-vi (so prefix+q in normal mode still works)
unbind -T copy-mode-vi q
bind Escape copy-mode
# similar to how `i` exits view mode and enters insert mode in vim
bind -T copy-mode-vi i send -X cancel
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection
bind -T copy-mode-vi 'Y' send -X copy-selection-and-cancel

# mouse copy
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down-and-cancel

# clear history scroll
bind space clear-history \; display-message "History cleared!"
bind C-space clear-history \; display-message "History cleared!"

#  %% -------- [windows panes tabs movement layout setup] ----------:

# renumber window index when closing
set-option -g renumber-windows on

# i have my own auto rename system
set-window-option -g automatic-rename off
# default for it (see SET_TMUX_WINDOW_AUTO_NAMING_MODE in zshrc); only if unset, so a reload keeps T's nested servers on pwd
if -F '#{@WINDOW_AUTO_NAMING_MODE}' '' 'set-window-option -g @WINDOW_AUTO_NAMING_MODE brain_parent'

# pane/layout movement shortcuts
# jump to notes
bind n select-pane -t :.1 \; if -F '#{window_zoomed_flag}' 'resize-pane -Z' '' \; resize-pane -t :.1 -y 50% \; send-keys C-g 0 \; send-keys Escape \; send-keys 1gt
bind C-n select-window -t :0 \; select-pane -t :0.1 \; if -F '#{window_zoomed_flag}' '' 'resize-pane -Z' \; send-keys C-g 0 \; send-keys Escape \; send-keys 1gt
bind N select-pane -t :.1 \; if -F '#{window_zoomed_flag}' '' 'resize-pane -Z' \; send-keys C-g 0 \; send-keys Escape \; send-keys 1gt
# jump to scratch
bind s select-pane -t :.1 \; if -F '#{window_zoomed_flag}' 'resize-pane -Z' '' \; resize-pane -t :.1 -y 50% \; send-keys C-g 0 \; send-keys Escape \; send-keys 2gt
bind C-s select-window -t :0 \; select-pane -t :0.1 \; if -F '#{window_zoomed_flag}' '' 'resize-pane -Z' \; send-keys C-g 0 \; send-keys Escape \; send-keys 2gt
bind S select-pane -t :.1 \; if -F '#{window_zoomed_flag}' '' 'resize-pane -Z' \; send-keys C-g 0 \; send-keys Escape \; send-keys 2gt
# jump to brain
bind b select-pane -t :.1 \; if -F '#{window_zoomed_flag}' 'resize-pane -Z' '' \; resize-pane -t :.1 -y 50% \; send-keys C-g 0 \;
bind C-b select-window -t :0 \; select-pane -t :0.1 \; if -F '#{window_zoomed_flag}' '' 'resize-pane -Z' \; send-keys C-g 0
bind B select-pane -t :.1 \; if -F '#{window_zoomed_flag}' '' 'resize-pane -Z' \; send-keys C-g 0
# jump to vim editors
bind v select-pane -t :.1 \; resize-pane -t :.1 -y 95% \; send-keys C-g 1
bind C-v select-pane -t :.1 \; resize-pane -t :.1 -y 95% \; send-keys C-g 2
bind V select-pane -t :.1 \; if -F '#{window_zoomed_flag}' '' 'resize-pane -Z' \; send-keys C-g 1
bind M-v select-pane -t :.1 \; if -F '#{window_zoomed_flag}' '' 'resize-pane -Z' \; send-keys C-g 2
# jump to AI
bind a select-pane -t :.0
bind C-a select-window -t :0 \; select-pane -t :0.0 \; if -F '#{window_zoomed_flag}' '' 'resize-pane -Z'
bind A select-pane -t :.0 \; if -F '#{window_zoomed_flag}' '' 'resize-pane -Z'
# jump to terminal
bind t select-pane -t :.2 \; resize-pane -t :.2 -y 50%
bind C-t select-window -t :0 \; select-pane -t :0.2 \; if -F '#{window_zoomed_flag}' '' 'resize-pane -Z'
bind T select-pane -t :.2 \; if -F '#{window_zoomed_flag}' '' 'resize-pane -Z'
# jump to terminal, then to a specific inner window (shift+digit = window index)
bind \) select-pane -t :.2 \; resize-pane -t :.2 -y 50% \; send-keys C-g 0
bind !  select-pane -t :.2 \; resize-pane -t :.2 -y 50% \; send-keys C-g 1
bind @  select-pane -t :.2 \; resize-pane -t :.2 -y 50% \; send-keys C-g 2
bind \# select-pane -t :.2 \; resize-pane -t :.2 -y 50% \; send-keys C-g 3
bind \$ select-pane -t :.2 \; resize-pane -t :.2 -y 50% \; send-keys C-g 4
bind %  select-pane -t :.2 \; resize-pane -t :.2 -y 50% \; send-keys C-g 5
bind ^  select-pane -t :.2 \; resize-pane -t :.2 -y 50% \; send-keys C-g 6
bind &  select-pane -t :.2 \; resize-pane -t :.2 -y 50% \; send-keys C-g 7
bind *  select-pane -t :.2 \; resize-pane -t :.2 -y 50% \; send-keys C-g 8
bind \( select-pane -t :.2 \; resize-pane -t :.2 -y 50% \; send-keys C-g 9

# splits
bind , split-window -h -c "#{pane_current_path}"
bind . split-window -c "#{pane_current_path}"

# h family
bind h select-pane -L
bind C-h previous-window
bind H splitw -fhb \; swapp -t ! \; killp -t !
bind -r M-h resize-pane -L 5

# j family
bind j select-pane -D
bind C-j run-shell 'zsh -c "source ~/.zshrc && TMUX_SWAP_WINDOW_NEXT" >/dev/null 2>&1'
bind J splitw -fv  \; swapp -t ! \; killp -t !
bind -r M-j resize-pane -D 5

# k family
bind k select-pane -U
bind C-k run-shell 'zsh -c "source ~/.zshrc && TMUX_SWAP_WINDOW_PREV" >/dev/null 2>&1'
bind K splitw -fvb \; swapp -t ! \; killp -t !
bind -r M-k resize-pane -U 5

# l family
bind l select-pane -R
bind C-l next-window
bind L splitw -fh  \; swapp -t ! \; killp -t !
bind -r M-l resize-pane -R 5

# e family
bind e select-window -t '{end}'
bind C-e run-shell 'tmux move-window -t 999 && tmux move-window -r'

# c family (create brain parent)
# in scratch unnamed
bind c run-shell 'zsh -c "source ~/.zshrc && TCOBPJ" >/dev/null 2>&1'
# in scratch named
bind C-c command-prompt -p 'Create in scratch? Enter name (no special chars):' 'run-shell "zsh -c \"source ~/.zshrc && TCOBPJ %1\" >/dev/null 2>&1"'
# in CWD unnamed
bind C confirm-before -y -p 'Create in #{pane_current_path}? (Enter to proceed)' 'run-shell "zsh -c \"cd \\\"#{pane_current_path}\\\" && source ~/.zshrc && TCOBP\" >/dev/null 2>&1"'
# in CWD named
bind M-c command-prompt -p 'Create in #{pane_current_path}? Enter name (no special chars):' 'run-shell "zsh -c \"cd \\\"#{pane_current_path}\\\" && source ~/.zshrc && TCOBP %1\" >/dev/null 2>&1"'

# o family (open existing path)
bind o new-window -a -c "#{pane_current_path}" -n "#{window_name}"
bind C-o new-window \; send-keys 'CDS' Enter

# switch to last active tab (like alt-tab)
bind C-w last-window
# send prefix to inner tmux (for nested sessions)
bind C-g send-prefix

# send pane to specific window position e.g. 1.0
bind M command-prompt -p "send pane to:"  "join-pane -t '%%'"

# rename window (prompt starts empty)
bind r command-prompt "rename-window '%%'; set-window-option @WINDOW_AUTO_NAMING_MODE locked"
# lock window name (disable auto-rename)
bind C-r set-window-option @WINDOW_AUTO_NAMING_MODE locked

bind X confirm-before -p "Kill window #W? (y/n)" kill-window

bind Q run-shell '~/doc/config/config/tmux/get_tmux_pane_identifier.sh "#{socket_path}" "#{pane_id}" "#{pane_current_command}" "#{pane_current_path}" clipboard'
bind C-q run-shell '~/doc/config/config/tmux/get_tmux_pane_identifier.sh "#{socket_path}" "#{pane_id}" "#{pane_current_command}" "#{pane_current_path}" popup'

#  %% -------- [kiro] ----------:

# fork kiro chat into new window, and load
bind -T mk f run-shell -b 'zsh -c "source ~/.zshrc && TMUX_KIRO_FORK_NEW_WINDOW"'
bind -T mk s run-shell -b 'zsh -c "source ~/.zshrc && TMUX_KIRO_SAVE_SESSION"'

#  %% -------- [inline text shortcuts] ----------:

bind -T ms b run-shell 'tmux send-keys -t "#{pane_id}" "btw, you are working from #{pane_current_path}. This project (task) has a \`brain/\` folder — my personal (and collaborative with AI) knowledge base for it. No need to read these now, just know they exist: \`brain/notes.txt\`: key task notes (gotchas, build/deploy/useful commands). \`brain/scratch/scratch.txt\`: scratch notes/pastes/logs — unorganized but permanent. \`brain/command_history.txt\`: every command run inside this dir, auto-logged by zsh hooks (timestamped, with invocation path) — useful if you need to see what has already been run. \`brain/brag.txt\`: my log of career-relevant wins from this project. \`brain/command_output/\`: write your temp logs here (build output etc.). \`brain/venv/\`: create and source virtualenvs here. \`brain/tmp/\`: temporary files, like /tmp (disposable). Acknowledge, then we can focus on the task:               "'

#  %% -------- [terminal commands] ----------:

bind -T m c send-keys -t 0.2 'CAFF' Enter
